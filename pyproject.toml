[project]
name = "statistical-gadget-use"
version = "0.1.0"
description = "Statistical analysis pipeline for the gadget-use study"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "polars>=1.44.2",
    "scipy>=1.18.1",
]

[project.scripts]
gadget-analysis = "gadget_analysis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gadget_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
